  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  symmetry_cfg: null
  rnd_cfg: null
clip_actions: null
save_interval: 500
experiment_name: b2_z1_curve_amp
run_name: ''
logger: tensorboard
neptune_project: isaaclab
